<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QA Shop - Playground</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header">
    <span class="brand">QA Shop</span>
    <nav>
      <a href="/inventory.html">Products</a>
      <a href="/playground.html">Playground</a>
    </nav>
  </header>

  <main>
    <h1>Automation playground</h1>
    <p class="muted">The tricky bits every QA engineer eventually meets: dialogs, new tabs, uploads and iframes.</p>

    <section class="card">
      <h2 style="font-size: 1.1rem; margin-top: 0">1. Browser dialogs</h2>
      <button data-testid="alert-button">Show alert</button>
      <button class="secondary" data-testid="confirm-button">Show confirm</button>
      <button class="secondary" data-testid="prompt-button">Show prompt</button>
      <p data-testid="dialog-result">No dialog handled yet</p>
    </section>

    <div class="spacer"></div>

    <section class="card">
      <h2 style="font-size: 1.1rem; margin-top: 0">2. New tab</h2>
      <a href="/about.html" target="_blank" rel="noopener" data-testid="new-tab-link">Open About in a new tab</a>
    </section>

    <div class="spacer"></div>

    <section class="card">
      <h2 style="font-size: 1.1rem; margin-top: 0">3. File upload</h2>
      <label for="receipt">Attach a receipt</label>
      <input id="receipt" type="file" data-testid="file-input" />
      <p data-testid="upload-result">No file selected</p>
    </section>

    <div class="spacer"></div>

    <section class="card">
      <h2 style="font-size: 1.1rem; margin-top: 0">4. Iframe</h2>
      <iframe src="/frame.html" title="Support widget" data-testid="support-frame" width="100%" height="160" style="border:1px solid #dfe3e8; border-radius:6px"></iframe>
    </section>

    <div class="spacer"></div>

    <section class="card">
      <h2 style="font-size: 1.1rem; margin-top: 0">5. Delayed content</h2>
      <button data-testid="start-job">Start background job</button>
      <p data-testid="job-status">Idle</p>
    </section>
  </main>

  <script src="/js/playground.js"></script>
</body>
</html>
